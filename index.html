<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Calculator">
    <meta name="application-name" content="smartCalculator">
    <title>Advanced Calculator</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calculator">
        <div class="header">
            <div class="left-section">
                <h1>smartCalculator</h1>
                <div class="memory-indicators">
                    <span class="mem-slot" id="mem1">M1<span class="dot"></span></span>
                    <span class="mem-slot" id="mem2">M2<span class="dot"></span></span>
                    <span class="mem-slot" id="mem3">M3<span class="dot"></span></span>
                </div>
            </div>
            <div class="right-section">
                <button class="btn-icon" id="themeToggle" onclick="toggleTheme()" title="Toggle dark/light mode">
                    <span id="themeIcon">🌙</span>
                </button>
                <button class="btn-icon" id="copyBtn" onclick="copyResult()" title="Copy result to clipboard">📋</button>
            </div>
        </div>
        
        <input type="text" id="display" class="display" readonly>
        <input type="text" id="expression" class="expression" readonly placeholder="Expression preview">
        
        <div class="button-grid">
            <!-- Memory Row -->
            <button class="btn memory" onclick="storeMemory(1)">M1</button>
            <button class="btn memory" onclick="storeMemory(2)">M2</button>
            <button class="btn memory" onclick="storeMemory(3)">M3</button>
            <button class="btn memory-clear" onclick="clearAllMemory()">MC</button>
            
            <!-- Row 1 -->
            <button class="btn" onclick="appendNumber('7')">7</button>
            <button class="btn" onclick="appendNumber('8')">8</button>
            <button class="btn" onclick="appendNumber('9')">9</button>
            <button class="btn operator" onclick="setOperator('÷')">÷</button>
            
            <!-- Row 2 -->
            <button class="btn" onclick="appendNumber('4')">4</button>
            <button class="btn" onclick="appendNumber('5')">5</button>
            <button class="btn" onclick="appendNumber('6')">6</button>
            <button class="btn operator" onclick="setOperator('×')">×</button>
            
            <!-- Row 3 -->
            <button class="btn" onclick="appendNumber('1')">1</button>
            <button class="btn" onclick="appendNumber('2')">2</button>
            <button class="btn" onclick="appendNumber('3')">3</button>
            <button class="btn operator" onclick="setOperator('−')">−</button>
            
            <!-- Row 4 -->
            <button class="btn" onclick="appendNumber('0')">0</button>
            <button class="btn" onclick="appendNumber('.')">.</button>
            <button class="btn control backspace" onclick="backspace()">⌫</button>
            <button class="btn operator" onclick="setOperator('+')">+</button>
            
            <!-- Row 5 -->
            <button class="btn function" onclick="setPower()">x^y</button>
            <button class="btn function" onclick="setSquareRoot()">√</button>
            <button class="btn control" onclick="clearCurrent()">C</button>
            <button class="btn control" onclick="clearAll()">AC</button>
            
            <!-- Row 6 (New Features & 2-row Equals) -->
            <button class="btn function" onclick="applyPercentage()" title="Percentage (%)">%</button>
            <button class="btn function" onclick="toggleSign()" title="Sign Toggle (±)">±</button>
            <button class="btn function converter-btn" onclick="openConverter()" title="Unit Converter">⇄</button>
            <button class="btn equals" onclick="calculate()" title="Calculate (=)">=</button>
            
            <!-- Recall Row (4th column occupied by tall Equals) -->
            <button class="btn memory-recall" onclick="recallMemory(1)">RM1</button>
            <button class="btn memory-recall" onclick="recallMemory(2)">RM2</button>
            <button class="btn memory-recall" onclick="recallMemory(3)">RM3</button>
        </div>
        
        <!-- History Panel -->
        <div class="history-panel">
            <div class="history-header">
                <h3>History</h3>
                <div class="history-actions">
                    <button class="btn-small history-toggle" id="historyToggle" onclick="toggleHistory()" aria-expanded="false">Show all</button>
                    <button class="btn-small" onclick="clearHistory()" title="Clear all history">🗑️</button>
                </div>
            </div>
            <div class="history-list" id="historyList">
                <p class="empty-history">No calculations yet</p>
            </div>
        </div>
    </div>

    <!-- Unit Converter Dialog -->
    <dialog class="converter-dialog" id="converterDialog">
        <div class="converter-header">
            <h2>Unit Converter</h2>
            <button class="btn-icon close-btn" type="button" onclick="closeConverter()" aria-label="Close converter">✕</button>
        </div>
        <div class="converter-tabs">
            <button class="converter-tab active" data-tab="length" type="button" onclick="setConverterCategory('length')">Length</button>
            <button class="converter-tab" data-tab="weight" type="button" onclick="setConverterCategory('weight')">Weight</button>
            <button class="converter-tab" data-tab="temp" type="button" onclick="setConverterCategory('temp')">Temp</button>
        </div>
        <div class="converter-body">
            <div class="converter-row">
                <label for="converterFromVal">From:</label>
                <div class="converter-field">
                    <input type="number" id="converterFromVal" class="converter-input" value="1" step="any" oninput="calculateConversion()">
                    <select id="converterFromUnit" class="converter-select" onchange="calculateConversion()"></select>
                </div>
            </div>
            <div class="converter-swap-row">
                <button type="button" class="btn-swap" onclick="swapConverterUnits()" title="Swap units">⇅</button>
            </div>
            <div class="converter-row">
                <label for="converterToVal">To:</label>
                <div class="converter-field">
                    <input type="text" id="converterToVal" class="converter-input" readonly>
                    <select id="converterToUnit" class="converter-select" onchange="calculateConversion()"></select>
                </div>
            </div>
        </div>
        <div class="converter-actions">
            <button class="btn-small" type="button" onclick="closeConverter()">Close</button>
            <button class="btn-small confirm-use" type="button" onclick="useConvertedValue()">📥 Use in Calculator</button>
        </div>
    </dialog>

    <dialog class="confirm-dialog" id="historyConfirmDialog">
        <h2>Clear history?</h2>
        <p>Delete all saved calculations?</p>
        <div class="confirm-actions">
            <button class="btn-small" type="button" onclick="closeHistoryDialog()">Cancel</button>
            <button class="btn-small confirm-delete" type="button" onclick="confirmClearHistory()">Delete</button>
        </div>
    </dialog>
    <style>
        #installBanner[hidden] { display: none; }
        #installBanner { position: fixed; z-index: 1000; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(520px, calc(100% - 24px)); display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px; border: 1px solid #667eea; border-radius: 14px; background: #fff; color: #1d2340; box-shadow: 0 12px 36px #1d234033; font: 14px system-ui, sans-serif; }
        #installBanner p { margin: 4px 0 0; color: #667085; }
        #installBanner .install-actions { display: flex; gap: 8px; flex: 0 0 auto; }
        #installBanner button { width: auto; margin: 0; border: 0; border-radius: 8px; padding: 9px 12px; font: inherit; cursor: pointer; }
        #installBanner #installBtn { background: #667eea; color: #fff; font-weight: 700; }
        #installBanner #installLater { background: #eef0f7; color: #1d2340; }
        @media (max-width: 480px) { #installBanner { align-items: stretch; flex-direction: column; } #installBanner .install-actions button { flex: 1; } }
    </style>
    <aside id="installBanner" role="region" aria-label="Install smartCalculator" hidden>
        <div><strong>Install smartCalculator</strong><p>Keep your calculator one tap away.</p></div>
        <div class="install-actions">
            <button id="installLater" type="button">Not now</button>
            <button id="installBtn" type="button">Install</button>
        </div>
    </aside>
    <script src="calculator.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js');
            });
        }
    </script>
</body>
</html>
